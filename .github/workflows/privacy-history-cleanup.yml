name: One-time verified privacy history cleanup

on:
  push:
    branches: [main]
    paths: [.github/workflows/privacy-history-cleanup.yml]

permissions:
  contents: write

concurrency:
  group: privacy-history-cleanup
  cancel-in-progress: false

jobs:
  clean-history:
    if: ${{ github.repository == 'victorpena210/is-the-shuttle-running' && github.event.head_commit.message == 'Fix public repository and run verified privacy cleanup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch retained pull request refs for auditing
        run: git fetch origin '+refs/pull/*:refs/pull/*'
      - name: Install pinned history-cleanup tool
        run: python -m pip install git-filter-repo==2.47.0
      - name: Verify, clean, and push existing branches
        env:
          EXPECTED_MAIN: ${{ github.sha }}
        run: python scripts/clean-public-history.py --expected-main "$EXPECTED_MAIN" --push
