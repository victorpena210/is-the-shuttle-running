name: Is the Shuttle Running Uptime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-uptime.yml
      - scripts/check-production-health.sh
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  readiness-check:
    # Monitor this project's public origin by default. Forks must opt in with
    # their own URL instead of polling the original project's production app.
    if: ${{ github.repository == 'victorpena210/is-the-shuttle-running' || vars.ROUTEPULSE_PRODUCTION_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    env:
      ROUTEPULSE_PRODUCTION_URL: ${{ vars.ROUTEPULSE_PRODUCTION_URL || 'https://istheshuttlerunning.com' }}
      INCIDENT_TITLE: "[Uptime] RoutePulse production readiness check failed"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Make health check executable
        run: chmod +x scripts/check-production-health.sh

      - name: Check production readiness
        id: health
        continue-on-error: true
        run: scripts/check-production-health.sh "$ROUTEPULSE_PRODUCTION_URL"

      - name: Open one incident issue on failure
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = process.env.INCIDENT_TITLE;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner, repo, title,
                body: `The scheduled production readiness check failed at ${new Date().toISOString()}.\n\nEndpoint: ${process.env.ROUTEPULSE_PRODUCTION_URL.replace(/\/$/, '')}/actuator/health/readiness\n\nReview the application host, database logs, and configured error reporting.`
              });
            }

      - name: Close uptime incident after recovery
        if: steps.health.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            const title = process.env.INCIDENT_TITLE;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            for (const issue of issues.filter(issue => !issue.pull_request && issue.title === title)) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Readiness recovered at ${new Date().toISOString()}. Closing this incident automatically.`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed'
              });
            }

      - name: Mark workflow failed when production is unhealthy
        if: steps.health.outcome == 'failure'
        run: exit 1
