name: Is the Shuttle Running CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Set up Node for browser-script tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run browser-script tests
        run: node --test src/test/js/*.test.cjs

      - name: Run automated tests
        run: ./mvnw -B clean verify

      - name: Build production Docker image
        run: docker build --tag routepulse:${{ github.sha }} .
