spring.application.name=routepulse

spring.profiles.default=dev

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB

spring.devtools.restart.enabled=false

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shuttleflow}
spring.datasource.username=${DB_USERNAME:shuttleflow_admin}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.data.jpa.repositories.enabled=true

# Six Flags operating-hours API. Use the CloudFront host first and keep the
# older FIMS host as an automatic fallback because this is an undocumented API.
sixflags.calendar.base-url=${SIXFLAGS_CALENDAR_BASE_URL:https://d18car1k0ff81h.cloudfront.net}
sixflags.calendar.fallback-base-url=${SIXFLAGS_CALENDAR_FALLBACK_BASE_URL:https://fims.prod.six-mt.com}
sixflags.calendar.park-id=${SIXFLAGS_CALENDAR_PARK_ID:914}

server.port=${PORT:8080}

app.base-url=${APP_BASE_URL:http://localhost:8080}

# Persistent sign-in is opt-in. The random local key changes on restart unless
# REMEMBER_ME_KEY is set. Production requires an explicit stable secret.
app.security.remember-me.key=${REMEMBER_ME_KEY:${random.uuid}}
app.security.remember-me.days=${REMEMBER_ME_DAYS:90}
app.security.remember-me.secure-cookie=false

# Pilot operating timezone used for actual shuttle start/stop timestamps.
app.operations-zone=America/Chicago

# Automatically save the next 28 days of driving assignments every five minutes.
app.automatic-schedule.enabled=${AUTOMATIC_SCHEDULE_ENABLED:true}
# Only drivers with a separately configured reminder address receive email; job runs in prod only.
app.driving-reminders.enabled=${DRIVING_REMINDERS_ENABLED:true}
# Slow park-calendar/UKG refreshes must not occupy the only scheduler thread at reminder time.
spring.task.scheduling.pool.size=4
# Temporary scare-actor transport on confirmed open dates; does not recur next year.
app.automatic-schedule.fright-fest-start=${FRIGHT_FEST_TRANSPORT_START:2026-10-24}
app.automatic-schedule.fright-fest-end=${FRIGHT_FEST_TRANSPORT_END:2026-11-01}

# Keep the public management surface intentionally small. External monitors should
# use /actuator/health/readiness; orchestrators may use /liveness separately.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,ping
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace,ping

# Production exception reporting. With no DSN, the Sentry SDK remains disabled,
# so local development and tests do not send telemetry anywhere.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.release=${SENTRY_RELEASE:routepulse-local}
sentry.send-default-pii=false
sentry.sample-rate=${SENTRY_ERROR_SAMPLE_RATE:1.0}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}
sentry.in-app-includes=technology.renatus.routepulse

# Put a non-sensitive correlation ID in application logs so a manager report,
# Railway log line, and Sentry event can be correlated without an email address.
logging.pattern.level=%5p [request:%X{requestId:-none}]

# Morning shuttle planning is generated from employee scheduled clock-ins.
# Only clock-ins inside this range influence the automatic MORNING assignment.
app.morning-shuttle.analysis-start=${MORNING_SHUTTLE_ANALYSIS_START:09:00}
app.morning-shuttle.analysis-end=${MORNING_SHUTTLE_ANALYSIS_END:12:00}
app.morning-shuttle.window-minutes=${MORNING_SHUTTLE_WINDOW_MINUTES:15}
app.morning-shuttle.buffer-minutes=${MORNING_SHUTTLE_BUFFER_MINUTES:15}
# Manager-facing transportation demand dashboard.
# Show same-day demand from 9:00 AM through 11:59 PM, including late pickups.
# Driver assignments are limited separately by wardrobe hours and uploaded work shifts.
# Overnight/early-morning activity remains under Off-hours demand.
app.transportation-demand.operating-start=${TRANSPORTATION_DEMAND_OPERATING_START:09:00}
app.transportation-demand.midday-start=${TRANSPORTATION_DEMAND_MIDDAY_START:12:00}
app.transportation-demand.evening-start=${TRANSPORTATION_DEMAND_EVENING_START:17:00}
app.transportation-demand.operating-end=${TRANSPORTATION_DEMAND_OPERATING_END:23:59}
app.transportation-demand.window-minutes=${TRANSPORTATION_DEMAND_WINDOW_MINUTES:15}
app.transportation-demand.buffer-minutes=${TRANSPORTATION_DEMAND_BUFFER_MINUTES:15}

# Driver recovery break. Morning and afternoon remain continuous unless the
# transportation plan contains a demand-free gap of at least this length.
# RoutePulse then reserves one protected break and does not count it as driving time.
app.driver-break.minimum-free-minutes=${DRIVER_BREAK_MINIMUM_FREE_MINUTES:15}
# Needs Attention command center. A missed start appears as a warning as soon
# as the scheduled time passes, then escalates to urgent after the start grace.
# The overrun grace still delays the end-of-shift overrun alert.
app.attention.start-grace-minutes=${ATTENTION_START_GRACE_MINUTES:10}
app.attention.overrun-grace-minutes=${ATTENTION_OVERRUN_GRACE_MINUTES:10}

# Employee schedule retention / anonymous forecasting history.
# Completed raw employee schedule rows are archived into anonymous 15-minute
# demand snapshots, then permanently deleted. The anonymous forecasting
# dataset is retained on a rolling 12-month basis by default.
app.retention.enabled=false
app.retention.cron=${SCHEDULE_RETENTION_CRON:0 15 2 * * *}
app.retention.forecast-history-months=${FORECAST_HISTORY_MONTHS:12}

# Persist/read absolute timestamps independently of the JVM/server timezone.
# Business schedule dates/times still use app.operations-zone.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Service verification: schedule demand + driving sessions + rider QR evidence
app.service-verification.minimum-demand-for-review=${SERVICE_VERIFICATION_MINIMUM_DEMAND_FOR_REVIEW:10}
app.service-verification.zero-confirmation-windows-for-review=${SERVICE_VERIFICATION_ZERO_CONFIRMATION_WINDOWS_FOR_REVIEW:2}
app.service-verification.strong-driving-coverage-percent=${SERVICE_VERIFICATION_STRONG_DRIVING_COVERAGE_PERCENT:50}
# Sessions automatically close at four hours; confirmation age, schedule and phone GPS do not change the cutoff.

# Local screenshot OCR binary (Docker installs it; local macOS: brew install tesseract).
app.schedule-ocr.command=${SCHEDULE_OCR_COMMAND:tesseract}
