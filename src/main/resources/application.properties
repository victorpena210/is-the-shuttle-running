spring.application.name=shuttleflow

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.devtools.restart.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/shuttleflow
spring.datasource.username=shuttleflow_admin
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.data.jpa.repositories.enabled=true

sixflags.calendar.base-url=https://fims.prod.six-mt.com
sixflags.calendar.park-id=914

server.port=${PORT:8080}

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.mail.from=${MAIL_FROM}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000