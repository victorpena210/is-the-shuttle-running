spring.application.name=shuttleflow

spring.profiles.default=dev

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.devtools.restart.enabled=false

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shuttleflow}
spring.datasource.username=${DB_USERNAME:shuttleflow_admin}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.data.jpa.repositories.enabled=true

sixflags.calendar.base-url=https://fims.prod.six-mt.com
sixflags.calendar.park-id=914

server.port=${PORT:8080}

app.base-url=${APP_BASE_URL:http://localhost:8080}

# Keep local development convenient. Production overrides this to false.
app.registration.enabled=${APP_REGISTRATION_ENABLED:true}

# Pilot operating timezone used for actual shuttle start/stop timestamps.
app.operations-zone=America/Chicago

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
