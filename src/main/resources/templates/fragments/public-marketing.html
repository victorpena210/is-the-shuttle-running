<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="seoMeta(pageTitle, description, canonicalUrl, socialTitle, socialDescription)">
        <title th:text="${pageTitle}">Is the Shuttle Running</title>
        <meta name="description" th:content="${description}">
        <meta name="robots" content="index, follow, max-image-preview:large">
        <link rel="canonical" th:href="${canonicalUrl}">

        <meta property="og:type" content="website">
        <meta property="og:site_name" content="Is the Shuttle Running">
        <meta property="og:title" th:content="${socialTitle}">
        <meta property="og:description" th:content="${socialDescription}">
        <meta property="og:url" th:content="${canonicalUrl}">
        <meta property="og:image" content="https://istheshuttlerunning.com/images/shuttle-og.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="Is the Shuttle Running employee shuttle operations software">

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" th:content="${socialTitle}">
        <meta name="twitter:description" th:content="${socialDescription}">
        <meta name="twitter:image" content="https://istheshuttlerunning.com/images/shuttle-og.png">
        <meta name="twitter:image:alt" content="Is the Shuttle Running employee shuttle operations software">

        <link rel="icon" th:href="@{/images/shuttle-mark.svg}" type="image/svg+xml">
        <link rel="stylesheet" th:href="@{/css/site.css}">
    </th:block>
</head>
<body>

<header th:fragment="marketingNav" class="landing-nav seo-nav">
    <div class="landing-nav__inner">
        <a class="brand landing-brand" th:href="@{/}" aria-label="Is the Shuttle Running home">
            <img class="brand-mark" th:src="@{/images/shuttle-mark.svg}" alt="">
            <span class="brand-copy">
                <span class="brand-name">Is the shuttle<br>running?</span>
                <span class="brand-tagline">istheshuttlerunning.com</span>
            </span>
        </a>

        <nav class="landing-nav__links" aria-label="Primary navigation">
            <a href="/#how-it-works">How it works</a>
            <a href="/#operations">For your team</a>
            <a href="/#riders">For riders</a>
        </nav>

        <div class="landing-nav__actions">
            <a class="landing-nav__signin" th:href="@{/login}">Sign in</a>
            <a class="button landing-nav__demo" href="/#demo-request">
                Get a demo
                <span aria-hidden="true">→</span>
            </a>
        </div>
    </div>
</header>

</body>
</html>
