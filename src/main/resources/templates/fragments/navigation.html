<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="managerNav(activePage)">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="app-topbar">
        <div class="app-topbar__inner">

            <a class="brand" th:href="@{/app}" aria-label="Is the Shuttle Running dashboard">
                <img class="brand-mark" th:src="@{/images/shuttle-mark.svg}" alt="">
                <span class="brand-copy">
                    <span class="brand-name">Is the shuttle<br>running?</span>
                    <span class="brand-tagline">istheshuttlerunning.com</span>
                </span>
            </a>

            <nav class="app-nav app-nav--manager" aria-label="Primary navigation">
                <a class="app-nav__link" th:href="@{/driving-records}"
                   th:attr="aria-current=${activePage == 'driving-records' ? 'page' : null}">Driving history</a>
                <a class="app-nav__link" th:href="@{/app/live-status}"
                   th:attr="aria-current=${activePage == 'live-status' ? 'page' : null}">Live shuttle status</a>
                <a class="app-nav__link" th:href="@{/drivers}"
                   th:attr="aria-current=${activePage == 'drivers' ? 'page' : null}">Drivers</a>

                <a
                    class="app-nav__link"
                    th:if="${canManageDrivingQr}"
                    th:href="@{/driving-qr}"
                    th:attr="aria-current=${activePage == 'driving-qr' ? 'page' : null}">
                    QR &amp; NFC setup
                </a>

                <a
                    class="app-nav__link"
                    th:if="${isOwner}"
                    th:href="@{/organization/invitations}"
                    th:attr="aria-current=${activePage == 'managers' ? 'page' : null}">
                    Managers
                </a>

                <form class="app-nav__form" th:action="@{/logout}" method="post">
                    <button class="app-nav__button" type="submit">Sign out</button>
                </form>
            </nav>
        </div>
    </header>
</th:block>

<th:block th:fragment="driverNav">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="app-topbar">
        <div class="app-topbar__inner">
            <a class="brand" th:href="@{/driver}" aria-label="Is the Shuttle Running driver home">
                <img class="brand-mark" th:src="@{/images/shuttle-mark.svg}" alt="">
                <span class="brand-copy">
                    <span class="brand-name">Is the shuttle<br>running?</span>
                    <span class="brand-tagline">Driver account</span>
                </span>
            </a>

            <nav class="app-nav" aria-label="Driver navigation">
                <a class="app-nav__link" th:href="@{/driver}">My driving</a>
                <a class="app-nav__link" th:href="@{/driver#driving-history}">My records</a>
                <form class="app-nav__form" th:action="@{/logout}" method="post">
                    <button class="app-nav__button" type="submit">Sign out</button>
                </form>
            </nav>
        </div>
    </header>
</th:block>

</body>
</html>
