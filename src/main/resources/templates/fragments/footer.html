<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<footer
    th:fragment="footer(variant)"
    class="site-footer"
    th:classappend="${variant == 'public'} ? ' site-footer--public' : ''">

    <div class="site-footer__inner">

        <!-- Is the Shuttle Running -->
        <div class="site-footer__identity">
            <img
                class="site-footer__mark"
                th:src="@{/images/shuttle-mark.svg}"
                alt="">

            <div>
                <strong>Is the shuttle running?</strong>
                <span>Clear answers. Better shuttle operations.</span>
            </div>
        </div>

        <!-- Renatus -->
        <div class="site-footer__renatus">

            <span class="site-footer__renatus-label">
                A product by
            </span>

            <a
                href="https://renatus.technology"
                aria-label="Visit Renatus Technology">

                <img
                    class="site-footer__renatus-logo"
                    th:src="@{/images/renatus-technology-logo.png}"
                    alt="Renatus Technology">
            </a>

        </div>

        <!-- Copyright / Support -->
        <div class="site-footer__meta">

            <p>
                &copy;
                <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">
                    2026
                </span>
                Is the Shuttle Running
            </p>

            <a href="mailto:victor@renatus.technology">
                Support
            </a>

        </div>

    </div>

</footer>

</body>
</html>
