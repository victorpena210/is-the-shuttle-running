<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="tabs"
        class="records-view-tabs"
        aria-label="Driving records views">

        <a
            class="records-view-tab"
            th:classappend="${selectedView == 'summary'} ? ' records-view-tab--active' : ''"
            th:attr="aria-current=${selectedView == 'summary' ? 'page' : null}"
            th:href="@{/driving-records(
                from=${fromDate},
                to=${toDate},
                driverId=${selectedDriverId},
                view='summary'
            )}">

            <span>
                Driver summary
            </span>

            <small>
                Workload totals
            </small>

        </a>

        <a
            class="records-view-tab"
            th:classappend="${selectedView == 'records'} ? ' records-view-tab--active' : ''"
            th:attr="aria-current=${selectedView == 'records' ? 'page' : null}"
            th:href="@{/driving-records(
                from=${fromDate},
                to=${toDate},
                driverId=${selectedDriverId},
                view='records'
            )}">

            <span>
                Individual records
            </span>

            <small>
                Assignment history
            </small>

        </a>

    </nav>
</body>
</html>
