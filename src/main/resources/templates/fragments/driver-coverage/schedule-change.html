<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <section th:fragment="scheduleChange(assignment)" class="coverage-control-block">

        <h4>Scheduled driving</h4>
        <p>
            Change the manager-approved driving window before driving begins.
        </p>

        <form
            th:action="@{/assignments/{assignmentId}/schedule(assignmentId=${assignment.id})}"
            method="post">

            <input
                type="hidden"
                name="assignmentDate"
                th:value="${selectedDate}">

            <div class="coverage-time-fields">

                <div class="form-group">
                    <label th:for="|start-${assignment.id}|">
                        Start
                    </label>

                    <input
                        type="time"
                        th:id="|start-${assignment.id}|"
                        name="scheduledStartTime"
                        th:value="${assignment.scheduledStartTime != null ? assignment.scheduledStartTime : recommendedStart}"
                        required>
                </div>

                <span class="coverage-time-arrow" aria-hidden="true">→</span>

                <div class="form-group">
                    <label th:for="|end-${assignment.id}|">
                        End
                    </label>

                    <input
                        type="time"
                        th:id="|end-${assignment.id}|"
                        name="scheduledEndTime"
                        th:value="${assignment.scheduledEndTime != null ? assignment.scheduledEndTime : recommendedEnd}"
                        required>
                </div>

            </div>

            <button
                class="button button--secondary button--block"
                type="submit">
                Save driving window
            </button>

        </form>

    </section>
</body>
</html>
