<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="statusCard(running, driverName, headingLevel)" class="rider-status-card" aria-live="polite"
         th:classappend="${running ? 'rider-status-card--running' : 'rider-status-card--stopped'}">
    <div class="rider-status-indicator" aria-hidden="true"></div>
    <h1 th:if="${headingLevel == 1}" class="rider-status-headline"
        th:text="${running ? 'The shuttle is running.' : 'The shuttle is not running.'}">The shuttle is not running.</h1>
    <h2 th:unless="${headingLevel == 1}" class="rider-status-headline"
        th:text="${running ? 'The shuttle is running.' : 'The shuttle is not running.'}">The shuttle is not running.</h2>
    <p class="rider-status-driver" th:if="${driverName != null}" th:text="|Driver: ${driverName}|">Driver: Driver name</p>
</section>
</body>
</html>
