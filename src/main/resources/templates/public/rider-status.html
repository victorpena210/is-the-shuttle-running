<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <meta
        name="theme-color"
        content="#17201c">

    <meta
        http-equiv="refresh"
        content="20">

    <meta name="robots" content="noindex, nofollow">
    <title
        th:text="|Shuttle status · ${organizationName}|">
        Shuttle status · Is the Shuttle Running
    </title>

    <link
        rel="icon"

    <link
        rel="stylesheet"

<body class="rider-status-page">
<header class="rider-brand-header">
    <a class="brand" th:href="@{/}" aria-label="Is the Shuttle Running home">
        <img class="brand-mark" th:src="@{/images/shuttle-mark.svg}" alt="">
        <span class="brand-copy"><span class="brand-name">Is the shuttle<br>running?</span></span>
    </a>
    <span th:text="${organizationName}">Your organization</span>
</header>
<main class="rider-status-shell rider-status-shell--simple">
