<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<div class="pickup-alert-list" th:fragment="cards(alerts, slot)">
    <article class="pickup-alert-card" th:each="alert : ${alerts}" th:classappend="${alert.due ? 'pickup-alert-card--due' : ''}">
        <p class="pickup-alert-due" th:if="${alert.due}" role="status" th:text="${alert.row.past ? 'Scheduled time passed' : 'Clock-out coming up'}"></p>
        <h3><span th:text="${alert.row.name}"></span> · Scheduled off <time th:datetime="${alert.row.clockOut}" th:text="${#temporals.format(alert.row.clockOut, 'MMM d, h:mm a')}"></time></h3>
        <p th:text="${alert.row.location}"></p>
        <p class="pickup-note">Last synced <span th:text="${#temporals.format(alert.row.lastSynced, 'MMM d, h:mm a')}"></span></p>
        <p class="pickup-note" th:if="${slot != null and alert.nearSlot(slot)}">Near your driving time</p>
        <p class="pickup-note">Help if you're available. No response or pickup confirmation is required.</p>
        <p class="pickup-warning" th:if="${alert.row.stale}">Schedule may be out of date.</p>
    </article>
</div>
</body></html>
