<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live shuttle status | Is the Shuttle Running</title>
<link rel="icon" th:href="@{/images/shuttle-mark.svg}" type="image/svg+xml">
<link rel="stylesheet" th:href="@{/css/site.css}"><link rel="stylesheet" th:href="@{/css/dashboard/live-status.css}"></head>
<body class="app-page">
<th:block th:replace="~{fragments/navigation :: managerNav('live-status')}"></th:block>
<main id="main-content" class="app-main">
<header class="page-header"><div><p class="eyebrow" th:text="${organizationName}"></p>
<h1>Live shuttle status</h1></div></header>
<div th:if="${successMessage}" class="alert alert--success" role="status" th:text="${successMessage}"></div>
<div th:if="${errorMessage}" class="alert alert--error" role="alert" th:text="${errorMessage}"></div>
<th:block th:replace="~{fragments/dashboard/live-status :: liveStatus}"></th:block>
</main><footer th:replace="~{fragments/footer :: footer('app')}"></footer>
<script th:src="@{/js/pages/live-status.js}" defer></script>
</body></html>
