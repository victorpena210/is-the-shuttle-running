<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ShuttleFlow Drivers</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f8;
            color: #1f2937;
        }

        .panel {
            max-width: 900px;
            margin-bottom: 24px;
            padding: 20px;
            background-color: white;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 300px;
            padding: 8px;
        }

        button {
            padding: 9px 16px;
            border: none;
            border-radius: 4px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        table {
            width: 100%;
            max-width: 900px;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #d1d5db;
            text-align: left;
        }

        th {
            background-color: #1f2937;
            color: white;
        }

        .message {
            max-width: 876px;
            padding: 12px;
            border-radius: 4px;
        }

        .success {
            color: #166534;
            background-color: #dcfce7;
        }

        .error {
            color: #991b1b;
            background-color: #fee2e2;
        }
    </style>
</head>

<body>

    <p><a th:href="@{/}">← Back to dashboard</a></p>

    <h1>Driver Registration</h1>

    <p
        th:if="${successMessage}"
        class="message success"
        th:text="${successMessage}">
    </p>

    <p
        th:if="${errorMessage}"
        class="message error"
        th:text="${errorMessage}">
    </p>

    <div class="panel">

        <h2>Register a driver</h2>

        <form th:action="@{/drivers}" method="post">

            <div class="form-group">
                <label for="employeeId">Employee ID</label>

                <input
                    type="text"
                    id="employeeId"
                    name="employeeId"
                    required>
            </div>

            <div class="form-group">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required>
            </div>

            <div class="form-group">
                <label>
                    <input
                        type="checkbox"
                        name="active"
                        value="true"
                        checked>
                    Active driver
                </label>
            </div>

            <button type="submit">Register Driver</button>
        </form>
    </div>

    <h2>Registered Drivers</h2>

    <table>
        <thead>
            <tr>
                <th>Employee ID</th>
                <th>Name</th>
                <th>Status</th>
                <th>Change status</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="driver : ${drivers}">
                <td th:text="${driver.employeeId}"></td>
                <td th:text="${driver.name}"></td>

                <td
                    th:text="${driver.active
                        ? 'Active'
                        : 'Inactive'}">
                </td>

                <td>
                    <form
                        th:action="@{/drivers/{id}/status(
                            id=${driver.id}
                        )}"
                        method="post">

                        <input
                            type="hidden"
                            name="active"
                            th:value="${!driver.active}">

                        <button
                            type="submit"
                            th:text="${driver.active
                                ? 'Set Inactive'
                                : 'Set Active'}">
                        </button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(drivers)}">
                <td colspan="4">
                    No drivers have been registered.
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
