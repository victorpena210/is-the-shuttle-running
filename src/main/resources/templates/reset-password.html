<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#07111f">
    <title>Reset Password | RoutePulse</title>
    <link rel="icon" th:href="@{/images/routepulse-mark.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/routepulse.css}">
</head>

<body class="public-page">
<main class="public-shell">
    <section class="public-story" aria-labelledby="product-heading">
        <a class="brand" th:href="@{/login}" aria-label="RoutePulse sign in">
            <img class="brand-mark" th:src="@{/images/routepulse-mark.svg}" alt="">
            <span class="brand-copy">
                <span class="brand-name">RoutePulse</span>
                <span class="brand-tagline">Shuttle operations</span>
            </span>
        </a>

        <p class="public-kicker">Secure account recovery</p>
        <h1 id="product-heading">Choose a new password.</h1>
        <p>
            After saving, this reset link cannot be used again.
        </p>
    </section>

    <section class="auth-panel" aria-labelledby="reset-password-heading">
        <p class="eyebrow">RoutePulse account</p>
        <h1 id="reset-password-heading">Create a new password</h1>
        <p class="auth-panel__intro">
            Use between 12 and 72 characters.
        </p>

        <form
            class="auth-form"
            th:action="@{/reset-password}"
            th:object="${resetPasswordForm}"
            method="post">

            <input type="hidden" th:field="*{token}">

            <div th:if="${#fields.hasGlobalErrors()}" class="error-summary" role="alert">
                <p
                    th:each="error : ${#fields.globalErrors()}"
                    th:text="${error}">
                    Password reset error
                </p>
            </div>

            <label for="password">New password</label>
            <input
                type="password"
                id="password"
                th:field="*{password}"
                autocomplete="new-password"
                minlength="12"
                maxlength="72"
                required>

            <p
                th:if="${#fields.hasErrors('password')}"
                th:errors="*{password}"
                class="field-error">
            </p>

            <label for="confirmPassword">Confirm new password</label>
            <input
                type="password"
                id="confirmPassword"
                th:field="*{confirmPassword}"
                autocomplete="new-password"
                minlength="12"
                maxlength="72"
                required>

            <p
                th:if="${#fields.hasErrors('confirmPassword')}"
                th:errors="*{confirmPassword}"
                class="field-error">
            </p>

            <button class="button button--block" type="submit">
                Save new password
            </button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer('public')}"></footer>
</body>
</html>
