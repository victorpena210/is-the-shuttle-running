<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#07111f">
    <title>Something Went Wrong | RoutePulse</title>
    <link rel="icon" th:href="@{/images/routepulse-mark.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>

<body class="app-page">
<main class="blocked-shell">
    <section class="blocked-panel" aria-labelledby="error-heading">
        <img class="brand-mark" th:src="@{/images/routepulse-mark.svg}" alt="">
        <div class="blocked-icon" aria-hidden="true">!</div>
        <p class="eyebrow">Request not completed</p>
        <h1 id="error-heading">RoutePulse could not complete that request.</h1>
        <p class="muted">
            Return to the dashboard and try again. If the problem continues,
            contact RoutePulse support.
        </p>
        <p class="mono muted" th:if="${status}" th:text="|Error ${status}|">Error</p>
        <p class="mono muted"
           th:if="${routePulseRequestId}"
           th:text="|Reference ${routePulseRequestId}|">
            Reference
        </p>

        <div class="button-row">
            <a class="button" th:href="@{/app}">Return to dashboard</a>
            <a class="button button--secondary" href="mailto:victor@renatus.technology">
                Contact support
            </a>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer('app')}"></footer>
</body>
</html>
